<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeHub Settings</title>
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
    }
    h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      color: #4fc3f7;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #b0b0b0;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 13px;
      background: #2d2d2d;
      color: #e0e0e0;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4fc3f7;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4fc3f7;
      color: #1e1e1e;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #29b6f6;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #1b5e20;
      color: #81c784;
      display: block;
    }
    .status.error {
      background: #b71c1c;
      color: #ef5350;
      display: block;
    }
    .info {
      margin-top: 15px;
      padding: 10px;
      background: #263238;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.5;
    }
    .info a {
      color: #4fc3f7;
      text-decoration: none;
    }
    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>⚡ CodeHub Settings</h2>
  
  <div class="input-group">
    <label for="githubToken">GitHub Personal Access Token</label>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
  </div>
  
  <div class="input-group">
    <label for="githubUsername">GitHub Username</label>
    <input type="text" id="githubUsername" placeholder="yourusername">
  </div>
  
  <div class="input-group">
    <label for="repoName">Repository Name</label>
    <input type="text" id="repoName" placeholder="dsa-solutions" value="dsa-solutions">
  </div>
  
  <button id="saveBtn">Save Configuration</button>
  
  <div id="status" class="status"></div>
  
  <div class="info">
    <strong>How to get a GitHub Token:</strong><br>
    1. Go to <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">GitHub Settings → Tokens</a><br>
    2. Click "Generate new token (classic)"<br>
    3. Select scopes: <code>repo</code><br>
    4. Generate and copy the token
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
